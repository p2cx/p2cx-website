    <path class="l" d="M670 262 L670 190 L694 190 L694 262"/>
    <path class="l" d="M698 262 L712 194 L734 198 L722 262"/>
    <path class="l" d="M650 232 L660 232 L660 246 L650 246 Z M677 232 L687 232 L687 246 L677 246 Z"/>
    <path class="l" d="M646 274 L642 290 M748 272 L752 288"/>

    <!-- Schreibtisch -->
    <path class="l" d="M40 392 Q400 386 762 391"/>
    <path class="l" d="M44 408 Q400 403 758 407"/>
    <path class="l" d="M92 408 L94 520 M708 407 L706 520"/>
    <path class="l" d="M600 408 L602 512 L706 510"/>
