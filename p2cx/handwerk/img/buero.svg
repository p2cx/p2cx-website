    <path class="l" d="M148 300 Q138 286 150 272 Q160 258 150 244"/>
    <path class="l" d="M172 302 Q164 290 174 278"/>

    <!-- Tablet flach auf dem Tisch -->
    <path class="l" d="M214 382 L232 352 L320 352 L310 382 Z"/>
    <path class="h" d="M232 372 L300 372 M240 362 L304 362"/>

    <!-- Rechnung kommt oben aus dem Bildschirm -->
    <path class="d" d="M420 150 L412 96 M400 140 L388 108"/>
