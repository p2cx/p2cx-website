    <path class="l" d="M128 316 L132 378 Q134 386 144 386 L182 386 Q192 386 192 378 L196 316"/>
    <path class="l" d="M126 316 Q162 324 198 316"/>
    <path class="l" d="M196 332 Q222 330 220 352 Q218 370 192 366"/>
