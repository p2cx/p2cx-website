<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="bu-title bu-desc">
  <title id="bu-title">Büro: Rechnung kommt fertig aus dem Laptop</title>
  <desc id="bu-desc">Gezeichnete Szene: Ein Schreibtisch mit aufgeklapptem Laptop, daneben eine dampfende Kaffeetasse und ein Tablet. Aus dem Bildschirm gleitet ein Rechnungsblatt heraus, über ihm ein goldenes Häkchen im Kreis. Im Hintergrund ein Regal mit Ordnern und ein Wandkalender.</desc>
  <style>
    .bg{fill:var(--paper,#faf7f0)}
    .l{fill:none;stroke:var(--ink,#2b2a27);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .h{fill:none;stroke:var(--ink,#2b2a27);stroke-width:1.8;stroke-linecap:round;opacity:.32}
    .d{fill:none;stroke:var(--ink,#2b2a27);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:2 7}
    .a{fill:none;stroke:var(--accent,#c9a44c);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .af{fill:var(--accent,#c9a44c);opacity:.22}
    .p{fill:var(--paper,#faf7f0)}
  </style>
  <rect class="bg" width="800" height="560"/>
  <g>
    <!-- Wandkalender -->
    <path class="l" d="M86 74 L210 72 L212 186 L88 188 Z"/>
    <path class="l" d="M86 98 L210 96"/>
    <path class="l" d="M112 66 L112 82 M184 64 L184 80"/>
