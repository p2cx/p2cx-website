    <path class="h" d="M234 186 L246 186 M254 186 L266 186"/>
    <path class="l" d="M548 206 L548 168 Q548 150 566 150 Q584 150 584 168 L584 206"/>
    <path class="l" d="M636 206 L636 156 Q610 150 616 124 Q626 98 652 108 Q676 100 684 124 Q690 150 664 156 L664 206"/>
    <path class="h" d="M650 156 L650 206"/>
    <path class="h" d="M300 90 Q314 80 330 88 Q344 78 360 90 M520 78 Q532 70 546 76"/>

    <!-- Innenspiegel -->
    <path class="l" d="M400 40 L400 62"/>
    <path class="l" d="M350 62 L450 62 Q458 62 458 70 L456 84 Q454 90 446 90 L354 90 Q346 90 344 84 L342 70 Q342 62 350 62 Z"/>

    <!-- A-Säulen -->
    <path class="l" d="M96 52 L40 60 L22 300 M48 282 L22 300"/>
    <path class="l" d="M704 52 L760 60 L780 300 M752 282 L780 300"/>

    <!-- Armaturenbrett -->
    <path class="l" d="M20 302 Q400 282 780 302"/>
