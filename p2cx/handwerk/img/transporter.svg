    <path class="l" d="M372 396 L428 396 L428 432 L372 432 Z"/>
    <path class="h" d="M380 406 L420 406 M380 414 L420 414 M380 422 L420 422"/>

    <!-- Lieferschein, eingeklemmt -->
    <g transform="rotate(-4 520 300)">
      <path class="p" d="M462 214 L572 214 L572 340 L462 340 Z"/>
      <path class="l" d="M466 214 L570 212 L574 334 L462 338 Z"/>
