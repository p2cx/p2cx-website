<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="tr-title tr-desc">
  <title id="tr-title">Im Transporter: Lieferschein am Armaturenbrett</title>
  <desc id="tr-desc">Gezeichnete Szene aus dem Fahrersitz eines Handwerker-Transporters: Lenkrad, Lüftung, Armaturenbrett, durch die Frontscheibe eine Straße mit Häusern. Am Armaturenbrett klemmt ein Lieferschein, daneben steckt ein Smartphone in der Halterung, das ihn mit einem goldenen Häkchen erfasst hat.</desc>
  <style>
    .bg{fill:var(--paper,#faf7f0)}
    .l{fill:none;stroke:var(--ink,#2b2a27);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .h{fill:none;stroke:var(--ink,#2b2a27);stroke-width:1.8;stroke-linecap:round;opacity:.32}
    .d{fill:none;stroke:var(--ink,#2b2a27);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:2 7}
    .a{fill:none;stroke:var(--accent,#c9a44c);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .af{fill:var(--accent,#c9a44c);opacity:.22}
    .p{fill:var(--paper,#faf7f0)}
  </style>
  <rect class="bg" width="800" height="560"/>
  <g>
    <!-- Frontscheibe -->
    <path class="l" d="M96 52 Q400 30 704 52 L752 282 Q400 266 48 282 Z"/>
    <!-- Blick nach draußen: Straße und Häuser -->
    <path class="h" d="M70 212 Q400 200 730 212"/>
    <path class="l" d="M372 206 L250 276 M428 206 L560 276"/>
    <path class="h" d="M400 214 L398 228 M397 242 L394 262"/>
