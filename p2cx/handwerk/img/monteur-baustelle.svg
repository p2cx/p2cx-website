<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="mb-title mb-desc">
  <title id="mb-title">Monteur im Heizungskeller</title>
  <desc id="mb-desc">Gezeichnete Szene: Ein Monteur in Latzhose und Kappe steht im Heizungskeller zwischen Therme, Rohren und Werkzeugkiste. Er hält ein Smartphone; eine vergrößerte Sprechblase zeigt darauf eine Liste, die mit jedem Häkchen um eine Zeile wächst.</desc>
