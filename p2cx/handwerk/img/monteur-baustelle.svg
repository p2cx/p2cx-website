    .bg{fill:var(--paper,#faf7f0)}
    .l{fill:none;stroke:var(--ink,#2b2a27);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .h{fill:none;stroke:var(--ink,#2b2a27);stroke-width:1.8;stroke-linecap:round;opacity:.32}
    .d{fill:none;stroke:var(--ink,#2b2a27);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:2 7}
    .a{fill:none;stroke:var(--accent,#c9a44c);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .af{fill:var(--accent,#c9a44c);opacity:.22}
    .p{fill:var(--paper,#faf7f0)}
  </style>
