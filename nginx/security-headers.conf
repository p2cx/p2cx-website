# Security-Header für p2cx.de (Board #1817, ISO 27001 A.8.21, Befund B-5)
# Standard: p2cx-playbook/development/security-headers.md
#
# Ziel auf Prod: /etc/nginx/snippets/p2cx-security-headers.conf
# Einbau und Prüfung: nginx/README.md
#
# Achtung nginx: add_header wird nur vererbt, wenn der innere Block KEIN eigenes
# add_header hat. Jeder location-Block mit eigenem add_header braucht deshalb
# selbst ein "include snippets/p2cx-security-headers.conf;".

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
